<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 12 | FLEXBOX</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <header>
        <h1>Utilizando Flexbox</h1>
    </header>
    <main>
        <h2>Utilizando o justify-content</h2>
        <div>
            <h3>Flex-Start</h3>
            <div class="container c1">
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
            </div>
            <h3>Flex-end</h3>
            <div class="container c2">
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
            </div>
            <h3>Center</h3>
            <div class="container c3">
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
            </div>
            <h3>Space-between</h3>
            <div class="container c4">
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
            </div>
            <h3>Space-around</h3>
            <div class="container c5">
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
            </div>
        </div>
        <br>
        <hr>
        <h2>Utilizando o align-items</h2>
        <div style="display: flex; gap: 10px;">
            <div>
                <h3>Align-items: flex-start;</h3>
                <div class="container c6">
                    <div class="item i2"></div>
                    <div class="item i1"></div>
                    <div class="item i3"></div>
                </div>
            </div>
            <div>
                <h3>Align-items: center;</h3>
                <div class="container c7">
                    <div class="item i2"></div>
                    <div class="item i1"></div>
                    <div class="item i3"></div>
                </div>
            </div>
            <div>
                <h3>Align-items: stretch;</h3>
                <div class="container c8">
                    <div class="item i"></div>
                    <div class="item i"></div>
                    <div class="item i"></div>
                </div>
            </div>
            <div>
                <h3>Align-items: flex-end;</h3>
                <div class="container c9">
                    <div class="item i2"></div>
                    <div class="item i1"></div>
                    <div class="item i3"></div>
                </div>
            </div>
        </div>
        <br><hr>
        <h2>Utilizando align-content</h2>
        <div style="display: flex; gap: 10px;">

        </div>
    </main>
</body>

</html>
