<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscrição para Vaga de Estágio</title>
</head>

<body>
    <main>
        <h1>Inscrição para Vaga de Estágio</h1>
        <p>Campos marcados com * são obrigatórios.</p>

        <form action="/inscricao" method="post" enctype="multipart/form-data">

            <fieldset>
                <legend>Dados pessoais</legend>

                <p>
                    <label for="nome">Nome completo *</label><br>
                    <input type="text" id="nome" name="nome" autocomplete="name" required minlength="3" maxlength="100"
                        placeholder="Ex.: Maria da Silva">
                </p>

                <p>
                    <label for="email">E-mail *</label><br>
                    <input type="email" id="email" name="email" autocomplete="email" required maxlength="120"
                        placeholder="maria@exemplo.com">
                </p>

                <p>
                    <label for="celular">Celular (com DDD) *</label><br>
                    <input type="tel" id="celular" name="celular" autocomplete="tel" inputmode="tel" required
                        pattern="\(?\d{2}\)?\s?9\d{4}-?\d{4}" title="Informe DDD e número, ex.: (27) 99999-9999"
                        placeholder="(27) 99999-9999">
                </p>
            </fieldset>

            <fieldset>
                <legend>Dados da candidatura</legend>

                <p>
                    <label for="area">Área de interesse *</label><br>
                    <select id="area" name="area" required autocomplete="off">
                        <option value="">Selecione uma área</option>
                        <option value="desenvolvimento">Desenvolvimento de Software</option>
                        <option value="redes">Redes e Infraestrutura</option>
                        <option value="suporte">Suporte Técnico</option>
                        <option value="dados">Dados e Análise</option>
                        <option value="ux">UX/UI Design</option>
                        <option value="outra">Outra</option>
                    </select>
                </p>

                <p>
                    <label for="curriculo">Currículo (PDF) *</label><br>
                    <input type="file" id="curriculo" name="curriculo" accept="application/pdf,.pdf" required
                        aria-describedby="ajuda-curriculo">
                    <br>
                    <small id="ajuda-curriculo">Envie apenas arquivos em formato PDF.</small>
                </p>
            </fieldset>

            <p>
                <input type="checkbox" id="lgpd" name="lgpd" value="aceito" required>
                <label for="lgpd">
                    Li e concordo com o tratamento dos meus dados pessoais para fins de
                    processo seletivo, conforme a Lei Geral de Proteção de Dados
                    (Lei nº 13.709/2018). *
                </label>
            </p>

            <p>
                <button type="submit">Enviar inscrição</button>
                <button type="reset">Limpar</button>
            </p>

        </form>
    </main>
</body>

</html>
